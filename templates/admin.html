{% extends "base.html" %}

{% block title %}后台管理{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>后台管理</h2>
    <a href="{{ url_for('admin_logout') }}" class="btn btn-secondary">退出登录</a>
</div>

<!-- 导航标签 -->
<ul class="nav nav-tabs mb-4">
    <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#prizesTab">奖品配置</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#wishesTab">许愿记录</button>
    </li>
</ul>

<!-- 奖品配置 -->
<div class="tab-content">
    <div class="tab-pane fade show active" id="prizesTab">
        <!-- 添加奖品按钮 -->
        <div class="mb-4">
            <button class="btn btn-success" onclick="showAddPrizeModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                添加奖品
            </button>
        </div>

        <!-- 奖品库 - 列表样式 -->
        <div class="card">
            <div class="card-body">
                <div id="prizesList"></div>
            </div>
        </div>
    </div>

    <!-- 许愿记录 -->
    <div class="tab-pane fade" id="wishesTab">
        <div class="card mb-4">
            <div class="card-header">
                <h5>重置许愿</h5>
            </div>
            <div class="card-body">
                <p class="text-muted">点击重置按钮将清空所有许愿记录和许愿菜单触发记录，所有用户可以重新许愿和触发菜单。</p>
                <button class="btn btn-danger" onclick="resetAllWishes()">重置许愿</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5>许愿记录管理</h5>
            </div>
            <div class="card-body">
                <div id="wishesList"></div>
                <p class="text-muted" id="noWishesMsg" style="display: none;">暂无许愿记录</p>
            </div>
        </div>
    </div>
</div>

<!-- 添加奖品弹窗 -->
<div class="modal fade" id="addPrizeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加奖品</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">奖品名称</label>
                    <input type="text" class="form-control" id="newPrizeName" placeholder="输入奖品名称">
                </div>
                <div class="mb-3">
                    <label class="form-label">奖品描述</label>
                    <input type="text" class="form-control" id="newPrizeDesc" placeholder="输入奖品描述">
                </div>
                <div class="mb-3">
                    <label class="form-label">库存数量</label>
                    <input type="number" class="form-control" id="newPrizeStock" value="1" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="addPrize()">添加</button>
            </div>
        </div>
    </div>
</div>

<style>
.prize-item {
    background-color: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.prize-info {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
}

.prize-icon {
    font-size: 1.5rem;
}

.prize-details {
    flex: 1;
}

.prize-name {
    font-weight: 600;
    color: #1a1a1a;
}

.prize-desc {
    font-size: 0.85rem;
    color: #666666;
}

.prize-stock {
    font-size: 0.85rem;
    color: #007aff;
}

.prize-actions {
    display: flex;
    gap: 8px;
}

.wish-item {
    background-color: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.wish-info {
    flex: 1;
}

.wish-time {
    font-size: 0.85rem;
    color: #666666;
}

.wish-content {
    color: #1a1a1a;
}
</style>
{% endblock %}

{% block scripts %}
<script>
// ========== 奖品管理 ==========
var prizes = [];

function loadPrizes() {
    fetch('/api/prizes')
    .then(function(response) { return response.json(); })
    .then(function(data) {
        prizes = data;
        renderPrizes();
    });
}

function renderPrizes() {
    var container = document.getElementById('prizesList');
    container.innerHTML = '';
    
    if (prizes.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">暂无奖品，请添加。</p>';
        return;
    }
    
    prizes.forEach(function(prize, index) {
        var html = '<div class="prize-item">' +
            '<div class="prize-info">' +
                '<div class="prize-details">' +
                    '<div class="prize-name">' + (prize.name || '未命名') + '</div>' +
                    '<div class="prize-desc">' + (prize.desc || '') + '</div>' +
                    '<div class="prize-stock">库存: ' + (prize.stock || 0) + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="prize-actions">' +
                '<button class="btn-icon-sm btn-edit" onclick="editPrizeStock(' + index + ')">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>' +
                '</button>' +
                '<button class="btn-icon-sm btn-delete" onclick="removePrize(' + index + ')">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' +
                '</button>' +
            '</div>' +
        '</div>';
        container.innerHTML += html;
    });
}

function showAddPrizeModal() {
    document.getElementById('newPrizeName').value = '';
    document.getElementById('newPrizeDesc').value = '';
    document.getElementById('newPrizeStock').value = '1';
    new bootstrap.Modal(document.getElementById('addPrizeModal')).show();
}

function addPrize() {
    var name = document.getElementById('newPrizeName').value.trim();
    var desc = document.getElementById('newPrizeDesc').value.trim();
    var stock = parseInt(document.getElementById('newPrizeStock').value) || 1;
    
    if (!name) {
        alert('请输入奖品名称');
        return;
    }
    
    prizes.push({name: name, desc: desc, stock: stock});
    renderPrizes();
    savePrizes();
    
    // 关闭弹窗
    bootstrap.Modal.getInstance(document.getElementById('addPrizeModal')).hide();
}

function editPrizeStock(index) {
    var newStock = prompt('请输入新的库存数量:', prizes[index].stock);
    if (newStock !== null) {
        prizes[index].stock = parseInt(newStock) || 0;
        renderPrizes();
        savePrizes();
    }
}

function removePrize(index) {
    prizes.splice(index, 1);
    renderPrizes();
    savePrizes();
}

function savePrizes() {
    fetch('/api/prizes/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(prizes)
    }).then(function(response) {
        return response.json();
    }).then(function(data) {
        console.log('保存结果:', data);
    });
}

// ========== 许愿记录管理 ==========
var wishes = [];

function loadWishes() {
    fetch('/api/wishes')
    .then(function(response) { return response.json(); })
    .then(function(data) {
        wishes = data;
        renderWishes();
    });
}

function renderWishes() {
    var container = document.getElementById('wishesList');
    var noMsg = document.getElementById('noWishesMsg');
    
    if (wishes.length === 0) {
        container.innerHTML = '';
        noMsg.style.display = 'block';
        return;
    }
    
    noMsg.style.display = 'none';
    container.innerHTML = '';
    
    wishes.forEach(function(wish, index) {
        var html = '<div class="wish-item">' +
            '<div class="wish-info">' +
                '<div class="wish-time">' + wish.time + '</div>' +
                '<div class="wish-content">' + wish.wish + '</div>' +
            '</div>' +
            '<div class="prize-actions">' +
                '<button class="btn-icon-sm btn-delete" onclick="deleteWish(' + index + ')">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' +
                '</button>' +
            '</div>' +
        '</div>';
        container.innerHTML += html;
    });
}

function deleteWish(index) {
    fetch('/api/wishes/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: index})
    })
    .then(function(response) { return response.json(); })
    .then(function(data) {
        if (data.status === 'ok') {
            wishes.splice(index, 1);
            renderWishes();
        }
    });
}

function resetAllWishes() {
    if (!confirm('确定要清空所有许愿记录吗？')) return;
    
    fetch('/api/wishes/clear', {
        method: 'POST'
    })
    .then(function(response) { return response.json(); })
    .then(function(data) {
        if (data.status === 'ok') {
            wishes = [];
            renderWishes();
            alert('已清空所有许愿记录');
        }
    });
}

// 初始化
loadPrizes();
loadWishes();
</script>
{% endblock %}
